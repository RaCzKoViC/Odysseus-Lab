name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-check:
    name: Check GitHub Pages configuration
    # Odysseus-Lab intentionally does not publish Pages in 0.1. The repository
    # is public now, but Pages is not enabled in Settings -> Pages, so
    # actions/configure-pages fails with "Not Found". Detect that here and skip
    # the build/deploy jobs (green, not red) until Pages is switched on with
    # Source = "GitHub Actions".
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Detect whether Pages is enabled for this repository
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if build_type="$(gh api "repos/${REPO}/pages" --jq '.build_type' 2>/dev/null)"; then
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is enabled (build_type=workflow); deploying."
            else
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Pages deploy skipped::GitHub Pages source is '${build_type}', not 'GitHub Actions'. Set Settings -> Pages -> Source = GitHub Actions to deploy website/."
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages deploy skipped::GitHub Pages is not enabled for ${REPO}. Enable it in Settings -> Pages (Source = GitHub Actions) to deploy website/."
          fi

  build:
    name: Package static site
    needs: pages-check
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: website
          destination: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy static site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  profile-notification:
    name: Notify profile after checks
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    permissions: {}
    uses: ./.github/workflows/notify-profile.yml
    secrets:
      PROFILE_DISPATCH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
